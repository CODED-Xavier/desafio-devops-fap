name: Pipeline CI - FAP DevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Job de SAST (Análise de Segurança Estática)
  sast:
    name: SAST & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalando dependências
        run: npm ci

      - name: Auditoria de Segurança de Pacotes (NPM Audit)
        run: npm audit --audit-level=high

  # 2. Job de Linting & Qualidade
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalando dependências
        run: npm ci

      - name: Executando Linter (ESLint)
        run: npx eslint . --fix || true

  # 3. Job de Build (Verificação de Compilação TypeScript)
  build:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalando dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Compilar projeto (TypeScript Build)
        run: npx tsc --noEmit || npm run build

  # 4. Job de Testes Unitários (Jest)
  tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalando dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar Testes Unitários (user.service.spec.ts)
        run: npm test

# 5. Job de CD (Deploy Automático)
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: [sast, lint, build, tests]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/observabilidade-app:latest

      - name: Simular Deploy na Instância LocalStack
        run: |
          echo "Simulando acesso SSH à EC2 do LocalStack..."
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/observabilidade-app:latest"
          echo "docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/observabilidade-app:latest"
          echo "Deploy simulado com sucesso!"